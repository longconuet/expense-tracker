# CI — chạy trên mọi PR + push vào develop/main.
# Postgres service: bắt buộc sau Phase 1 (schema postgresql). Trước Phase 1
# (schema còn sqlite) service nằm idle — CI vẫn xanh vì test chạy trên test.db.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Unit test + Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: etracker
          POSTGRES_PASSWORD: etracker
          POSTGRES_DB: et_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://etracker:etracker@localhost:5432/et_test
      DIRECT_URL: postgresql://etracker:etracker@localhost:5432/et_test
      # Unit test đọc DB này qua apps/api/test/dbUrl.ts (override default local docker)
      TEST_DATABASE_URL: postgresql://etracker:etracker@localhost:5432/et_test
      JWT_SECRET: ci-only-secret-khong-dung-san-sanh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      # Build TRƯỚC test: @expense-tracker/shared phải có dist (JS + d.ts)
      # để api/web resolve được khi type-check + chạy test
      - name: Build (tsc shared + typecheck + vite)
        run: pnpm -r build
      - name: Unit + integration tests
        run: pnpm -r test

  # Migrate Supabase khi push develop — Vercel git-integration tự tạo PREVIEW
  # cho develop mà không chạy migration → bẫy 500 "column does not exist" khi
  # code mới SELECT cột chưa có trong DB (incident 25/09 cột username).
  # Job idempotent: không có migration mới = no-op (chạy mỗi push develop).
  # ⚠ Preview và production CHUNG 1 DB Supabase → migration develop áp dụng
  # SỚM vào DB production. Quy ước bắt buộc: migration trên develop phải
  # backward-compatible (additive: thêm cột nullable, bảng mới, index);
  # migration phá huỷ (drop cột, đổi data) phải staging qua PR main
  # (expand trước, contract sau release) — không được vào develop trực tiếp.
  # cancel-in-progress: run bị kill giữa chừng → mỗi migration Prisma chạy
  # trong 1 transaction (rollback) — run kế tiếp tự apply lại, không hỏng DB.
  # PR preview (chưa merge): không migrate tự động — migration chưa review
  # không chạm DB production; preview PR cần migrate thì chạy tay.
  migrate:
    name: Prisma migrate deploy (Supabase — preview develop)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Dùng DIRECT URL (port 5432) — migrations không chạy được qua pooler.
      # Set CẢ HAI DATABASE_URL + DIRECT_URL: schema khai báo directUrl = env("DIRECT_URL")
      # và prisma.config.ts (dotenv/config) không có .env trên runner
      # (bỏ qua → P1012 "Environment variable not found: DIRECT_URL").
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: pnpm --filter @expense-tracker/api exec prisma migrate deploy
