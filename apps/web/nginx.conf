server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API sang container `api` — same domain nên refresh cookie (httpOnly)
  # hoạt động bình thường, không cần CORS.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Tài nguyên hashed (vite) — cache dài hạn
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: mọi route không phải file thật đều rơi về index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
